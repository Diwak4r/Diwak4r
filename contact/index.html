        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Google Sans Flex", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-optical-sizing: auto;
            background-color: var(--bg-primary);

        .font-display { font-family: "Google Sans Flex", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .section { padding: 5rem 0; padding-top: 100px; }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--header-bg);
            -webkit-backdrop-filter: blur(12px) saturate(180%);

            border-bottom: 1px solid color-mix(in srgb, var(--border-light) 60%, transparent);

        .nav-links { display: flex; gap: 1.75rem; list-style: none; align-items: center; }

        .logo { font-size: 1.375rem; font-weight: 650; color: var(--accent-secondary); text-decoration: none; letter-spacing: -0.02em; }
        .theme-toggle { background: none; border: none; cursor: pointer; color: var(--text-primary); padding: 0.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.5rem; color: var(--text-primary); cursor: pointer; }

        .contact-content { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: flex; }

        }

            <div class="contact-content">

                    <h2 class="text-2xl font-semibold mb-6">Send a Message</h2>
                    <form action="https://formsubmit.co/diwak4r.comp@gmail.com" method="POST" id="contact-form">
                        <!-- Honeypot (spam protection) - bots fill this, humans don't see it -->
                        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
                        <!-- Enable Captcha for additional spam protection -->
                        <input type="hidden" name="_captcha" value="true">
                        <!-- Email Subject -->
                        <input type="hidden" name="_subject" value="New Contact Form Submission - Portfolio">
                        <!-- Email Template -->
                        <input type="hidden" name="_template" value="table">
                        <!-- Redirect after submission -->
                        <input type="hidden" name="_next" value="https://diwakaryadav.com.np/thank-you/">

                        <input type="hidden" name="_autoresponse"
                            value="Thank you for contacting me! I'll get back to you soon.">

                        <div class="form-group">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" name="name" class="form-input" placeholder="Your Name" required
                                minlength="2" maxlength="100"
                                title="Please enter your name"
                                autocomplete="name">
                        </div>
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-input"
                                placeholder="your.email@example.com" required maxlength="254" autocomplete="email">
                        </div>
                        <div class="form-group">
                            <label for="purpose" class="form-label">Purpose of Inquiry</label>
                            <select id="purpose" name="purpose" class="form-select" required>
                                <option value="" disabled selected>Select a purpose...</option>
                                <option value="Collaboration on AI Projects">Collaboration on AI Projects</option>
                                <option value="Hiring / Job Opportunity">Hiring / Job Opportunity</option>
                                <option value="Freelance Work">Freelance Work</option>
                                <option value="General Inquiry">General Inquiry</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" id="subject" name="subject" class="form-input"
                                placeholder="Project Discussion" required minlength="3" maxlength="200">
                        </div>
                        <div class="form-group">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" name="message" rows="5" class="form-input"
                                placeholder="Tell me about your project..." required minlength="10"
                                maxlength="5000"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Send Message</button>
                    </form>
