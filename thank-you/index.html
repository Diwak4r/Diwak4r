    <!-- Theme detection early to avoid color flash -->
    <script>
    (function () {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>

    <style>
        :root {
            --bg-primary: #FEFAE0;

        body {

        .header {

            right: 0;

        .nav { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; }

        .nav-link { color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 0.925rem; }
        .logo { font-size: 1.375rem; font-weight: 650; color: var(--accent-secondary); text-decoration: none; letter-spacing: -0.02em; }

        .mobile-menu-btn { display: none; }
        @media (max-width: 768px) { .nav-links { display: none; } .mobile-menu-btn { display: block; } }

    <style>
        .thank-you-section {
            min-height: 80vh;

            align-items: center;

            text-align: center;

        .thank-you-content {
            max-width: 600px;

        .thank-you-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, var(--color-primary, #9d4edd) 0%, var(--color-accent, #7b2cbf) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }

        .thank-you-icon svg {
            width: 50px;
            height: 50px;
            color: white;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(157, 78, 221, 0.4);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(157, 78, 221, 0);

        .thank-you-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--color-primary, #9d4edd), var(--color-accent, #7b2cbf));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .thank-you-text {
            font-size: 1.2rem;
            color: var(--color-text-secondary, #666);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .back-home-btn {

            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .back-home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(157, 78, 221, 0.4);
        }
    </style>
</head>
