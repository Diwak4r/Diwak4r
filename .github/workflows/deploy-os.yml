# Build & deploy DiwakarOS (os.diwakaryadav.com.np) to GitHub Pages.
#
# ASSUMPTION — confirm before relying on this:
#   DiwakarOS is published to its OWN GitHub Pages site / custom domain
#   (os.diwakaryadav.com.np). In practice that means either (a) a separate repo,
#   or (b) a separate branch/environment from the main site. This workflow deploys
#   to the `github-pages` environment — if both sites share one environment you
#   must split them (different environment names / branches) or they will collide.
name: Deploy DiwakarOS

on:
  push:
    branches: [main]
    paths: ['portfolio-os/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-os
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-os/package-lock.json
      - run: npm ci
      - run: npm run build   # next export -> portfolio-os/out
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-os/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
