# Deploy the MAIN static portfolio (diwakaryadav.com.np).
#
# Two targets:
#   1. GitHub Pages (build + deploy jobs) — fallback copy, kept for rollback.
#   2. Cloudflare Workers static assets (deploy-cloudflare job) — THE live host
#      since 2026-09-11; serves via zone routes on apex+www and applies
#      `_headers` natively. Requires the CLOUDFLARE_API_TOKEN repo secret
#      (token with Workers Scripts:Edit + Workers Routes:Edit for this zone);
#      the job skips itself when the secret is absent.
#   DiwakarOS (portfolio-os) is a SEPARATE origin (os.diwakaryadav.com.np),
#   deployed from the diwakaros repo.
name: Deploy main site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble publishable root site
        run: |
          mkdir -p _site
          for item in *; do
            case "$item" in
              portfolio-os|node_modules|.git|.workbuddy-ai|.github|scripts|_site) ;;
              *) cp -R "$item" "_site/$item" ;;
            esac
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Cloudflare token
        run: echo "HAS_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_ENV"
      - name: Deploy to Cloudflare Workers (live host)
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          command: deploy --config wrangler.jsonc
