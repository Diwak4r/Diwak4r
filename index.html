<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="index, follow">
    <title>Diwakar Ray Yadav | Portfolio</title>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://diwakaryadav.com.np/">

    <!-- Preconnect to external resources for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">

    <!-- Google Sans Flex - Premium Variable Font -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet">

    <!-- Preload critical CSS -->
    <link rel="preload" href="css/style.css" as="style">

    <!-- Critical CSS fallback for content visibility -->
    <style>
        /* Ensure content is visible by default */
        .fade-in {
            opacity: 1 !important;
            transform: none !important;
        }

        .fade-in.js-enabled {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .fade-in.js-enabled.visible {
            opacity: 1;
            transform: translateY(0);
        }

        body {
            font-family: "Google Sans Flex", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-optical-sizing: auto;
            margin: 0;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .hero {
            padding: 8rem 0 4rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
    </style>

    <link rel="stylesheet" href="css/style.css">

    <!-- SEO & Open Graph -->
    <meta name="description"
        content="Portfolio of Diwakar Ray Yadav - Exploring Gen-AI & LLMs. Integrating AI into everyday workflows.">
    <meta name="keywords" content="Diwakar Ray Yadav, Portfolio, Gen-AI, LLMs, AI, Web Developer, Nepal">
    <meta name="author" content="Diwakar Ray Yadav">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://diwakaryadav.com.np/">
    <meta property="og:title" content="Diwakar Ray Yadav | Portfolio">
    <meta property="og:description" content="Exploring Gen-AI & LLMs — Integrating AI into everyday workflows.">
    <meta property="og:image" content="https://diwakaryadav.com.np/images/home.webp">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://diwakaryadav.com.np/">
    <meta property="twitter:title" content="Diwakar Ray Yadav | Portfolio">
    <meta property="twitter:description" content="Exploring Gen-AI & LLMs — Integrating AI into everyday workflows.">
    <meta property="twitter:image" content="https://diwakaryadav.com.np/images/home.webp">

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍💻</text></svg>">
    <!-- Clean URL Cosmetic Fix -->
    <script>
        if (window.location.pathname.endsWith('/index.html')) {
            window.history.replaceState(null, '', '/');
        }
    </script>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="logo font-display">Diwakar</a>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link active">Home</a></li>
                    <li><a href="/projects/" class="nav-link">Projects</a></li>
                    <li><a href="/about/" class="nav-link">About</a></li>
                    <li><a href="/blog/" class="nav-link">Blog</a></li>
                    <li><a href="/contact/" class="nav-link">Contact</a></li>
                </ul>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="mobile-menu-btn" aria-label="Menu">☰</button>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-text fade-in">
                    <h1 class="font-display">
                        Hello, I'm <span style="color: var(--accent-primary);">Diwakar</span>
                    </h1>
                    <p class="subtitle">
                        Exploring Gen-AI & LLMs — Integrating AI into everyday workflows for smarter, efficient outputs.
                    </p>
                    <div class="hero-buttons">
                        <a href="/projects/" class="btn btn-primary pulse">View Work</a>
                        <a href="/contact/" class="btn btn-secondary">Contact Me</a>
                    </div>
                </div>

                <!-- Hero Gallery with optimized images -->
                <div class="hero-gallery fade-in">
                    <div class="gallery-item main">
                        <img src="images/home.webp" alt="Diwakar Ray Yadav" width="400" height="400" loading="eager"
                            decoding="async" fetchpriority="high">
                    </div>
                    <div class="gallery-item sub-1">
                        <img src="images/aboutme.webp" alt="Diwakar Portrait" width="150" height="150" loading="lazy"
                            decoding="async">
                    </div>
                    <div class="gallery-item sub-2">
                        <img src="images/casual.webp" alt="Diwakar Casual" width="150" height="150" loading="lazy"
                            decoding="async">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Diwakar Ray Yadav. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js" defer></script>
</body>

</html>
